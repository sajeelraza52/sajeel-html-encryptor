<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sajeel Mods | HTML Encryptor / Decryptor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #8b5cf6;
    --primary-2: #06b6d4;
    --accent: #f472b6;
    --bg: #0a0a0f;
    --card: rgba(20, 20, 30, 0.85);
    --border: rgba(139, 92, 246, 0.35);
    --text: #e5e7eb;
    --muted: #9ca3af;
    --success: #10b981;
    --danger: #ef4444;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 20px 100px;
    background-image:
        radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.18) 0%, transparent 40%);
    background-attachment: fixed;
}
.container {
    max-width: 1000px;
    margin: 0 auto;
    background: var(--card);
    padding: 28px;
    border-radius: 20px;
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 60px rgba(139, 92, 246, 0.15), 0 20px 40px rgba(0,0,0,0.4);
}
header {
    text-align: center;
    padding-bottom: 18px;
    margin-bottom: 22px;
    border-bottom: 2px solid var(--border);
}
.logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--primary), var(--primary-2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
    filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.6));
}
.subtitle {
    color: var(--muted);
    margin-top: 6px;
    font-size: 0.95rem;
    letter-spacing: 1px;
}
.subtitle i { color: var(--primary-2); }

/* Mode selector */
.mode-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    justify-content: center;
}
.mode-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 30px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--muted);
    transition: 0.25s;
}
.mode-pill:hover { border-color: var(--primary-2); color: var(--primary-2); }
.mode-pill.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: white;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
}
.mode-pill i { font-size: 0.8rem; }

textarea {
    width: 100%;
    height: 190px;
    padding: 14px;
    background: rgba(0,0,0,0.4);
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 12px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    resize: vertical;
    transition: 0.3s;
    line-height: 1.5;
}
textarea:focus {
    outline: none;
    border-color: var(--primary-2);
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
}
.stats {
    display: flex;
    justify-content: space-between;
    margin: 8px 0 14px;
    padding: 0 5px;
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
}
.stats i { color: var(--primary); }
.btn-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin: 14px 0;
}
button, .file-btn {
    padding: 12px 16px;
    background: rgba(255,255,255,0.05);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.5px;
    transition: 0.25s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
}
button:hover, .file-btn:hover {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
}
button:active { transform: translateY(0); }
button.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border-color: transparent;
    color: white;
}
button.success {
    background: linear-gradient(135deg, var(--success), #059669);
    border-color: transparent;
    color: white;
}
button.danger {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.4);
    color: #fca5a5;
}
button.danger:hover {
    background: linear-gradient(135deg, var(--danger), #b91c1c);
    color: white;
    box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
}
.actions-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 18px 0;
}

/* Contact FAB */
.contact-fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: white;
    text-decoration: none;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.92rem;
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.45);
    transition: 0.3s;
    z-index: 100;
    font-family: 'Rajdhani', sans-serif;
}
.contact-fab:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 30px rgba(37, 211, 102, 0.6);
}
.contact-fab i { font-size: 1.2rem; }

/* Toast */
.toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    padding: 12px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-weight: 600;
    font-size: 0.9rem;
    z-index: 1000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    gap: 8px;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--success); }
.toast.success i { color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast.error i { color: var(--danger); }
.toast.info { border-color: var(--primary-2); }
.toast.info i { color: var(--primary-2); }
.toast.warn { border-color: #f59e0b; }
.toast.warn i { color: #f59e0b; }

/* Modal */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    z-index: 200;
    padding: 20px;
    align-items: center;
    justify-content: center;
}
.modal.show { display: flex; }
.modal-content {
    width: 100%;
    max-width: 900px;
    height: 80vh;
    background: #0d0d12;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: modalIn 0.3s ease-out;
}
@keyframes modalIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: rgba(139, 92, 246, 0.1);
    border-bottom: 1px solid var(--border);
}
.modal-header h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1rem;
    color: var(--primary-2);
}
.modal-close {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.6rem;
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}
.modal-close:hover { background: rgba(239,68,68,0.2); color: var(--danger); }
#previewIframe {
    flex: 1;
    width: 100%;
    border: none;
    background: white;
}

footer {
    text-align: center;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
}
footer .brand {
    font-family: 'Orbitron', sans-serif;
    color: var(--primary-2);
    font-weight: 700;
    letter-spacing: 1px;
}
footer a { color: var(--primary-2); text-decoration: none; }
footer a:hover { text-decoration: underline; }
#fileInput { display: none; }

@media (max-width: 600px) {
    .logo { font-size: 1.4rem; }
    .container { padding: 18px; }
    .contact-fab span { display: none; }
    .contact-fab { padding: 14px; border-radius: 50%; }
    body { padding: 12px 12px 80px; }
}
</style>
</head>
<body>

<!-- Contact Developer FAB -->
<a href="https://wa.me/923061601587" target="_blank" class="contact-fab" title="Contact Developer">
    <i class="fab fa-whatsapp"></i>
    <span>Contact Developer</span>
</a>

<div class="container">
    <header>
        <div class="logo">SAJEEL MODS</div>
        <p class="subtitle"><i class="fas fa-shield-halved"></i> HTML Encryptor / Decryptor</p>
    </header>

    <div class="mode-bar">
        <div class="mode-pill active" data-mode="basic" onclick="setMode('basic', this)">
            <i class="fas fa-bolt"></i> Basic
        </div>
        <div class="mode-pill" data-mode="full" onclick="setMode('full', this)">
            <i class="fas fa-shield"></i> Full (Unicode)
        </div>
        <div class="mode-pill" data-mode="base64" onclick="setMode('base64', this)">
            <i class="fas fa-database"></i> Base64
        </div>
    </div>

    <textarea id="InputArea" placeholder="Paste your HTML or encoded code here..."></textarea>
    <div class="stats">
        <span id="topSize"><i class="fas fa-text-height"></i> 0 characters</span>
        <span><i class="fas fa-arrow-up"></i> Input</span>
    </div>

    <div class="btn-row">
        <button class="primary" onclick="doEncode(this)"><i class="fas fa-lock"></i> Encode</button>
        <button class="primary" onclick="doDecode(this)"><i class="fas fa-unlock"></i> Decode</button>
        <button onclick="swapSides()"><i class="fas fa-right-left"></i> Swap</button>
        <button class="danger" onclick="clearAll()"><i class="fas fa-trash"></i> Clear</button>
    </div>

    <textarea id="OutputArea" readonly placeholder="Converted code will appear here..."></textarea>
    <div class="stats">
        <span id="bottomSize"><i class="fas fa-text-height"></i> 0 characters</span>
        <span><i class="fas fa-arrow-down"></i> Output</span>
    </div>

    <div class="btn-row">
        <button onclick="preview(0)"><i class="fas fa-eye"></i> Preview Input</button>
        <button onclick="preview(1)"><i class="fas fa-eye"></i> Preview Output</button>
        <button class="success" onclick="copyOutput(this)"><i class="fas fa-copy"></i> Copy</button>
        <button onclick="downloadOutput()"><i class="fas fa-download"></i> Download</button>
    </div>

    <div class="actions-bar">
        <label for="fileInput" class="file-btn"><i class="fas fa-upload"></i> Upload HTML File</label>
        <input type="file" id="fileInput" accept=".html,.htm,.txt" onchange="uploadFile(event)">
    </div>

    <footer>
        <p><i class="fas fa-code"></i> Crafted with <i class="fas fa-heart" style="color:var(--accent)"></i> by <span class="brand">SAJEEL MODS</span></p>
        <p style="margin-top:6px;">
            <a href="https://wa.me/923061601587" target="_blank"><i class="fab fa-whatsapp"></i> Contact Developer</a>
        </p>
    </footer>
</div>

<!-- Preview Modal -->
<div class="modal" id="previewModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="previewTitle"><i class="fas fa-eye"></i> Preview</h3>
            <button class="modal-close" onclick="closePreview()">&times;</button>
        </div>
        <iframe id="previewIframe" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
    </div>
</div>

<script>
    let currentMode = 'basic';
    const $input = document.getElementById('InputArea');
    const $output = document.getElementById('OutputArea');
    const $previewModal = document.getElementById('previewModal');
    const $previewIframe = document.getElementById('previewIframe');
    const $previewTitle = document.getElementById('previewTitle');

    /* ---------- Toast ---------- */
    function toast(message, type = 'info') {
        const icons = { success: 'check-circle', error: 'times-circle', info: 'info-circle', warn: 'exclamation-triangle' };
        const el = document.createElement('div');
        el.className = 'toast ' + type;
        el.innerHTML = '<i class="fas fa-' + (icons[type] || 'info-circle') + '"></i> ' + message;
        document.body.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => el.remove(), 400);
        }, 2500);
    }

    /* ---------- Mode ---------- */
    function setMode(mode, el) {
        currentMode = mode;
        document.querySelectorAll('.mode-pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
    }

    /* ---------- Encoding helpers ---------- */
    function utf8ToBase64(str) {
        return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_, p1) =>
            String.fromCharCode(parseInt(p1, 16))));
    }
    function base64ToUtf8(str) {
        return decodeURIComponent(Array.from(atob(str), c =>
            '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    }
    function unicodeEscape(str) {
        let out = '';
        for (let i = 0; i < str.length; i++) {
            out += '\\u' + str.charCodeAt(i).toString(16).padStart(4, '0');
        }
        return out;
    }

    /* ---------- Encode ---------- */
    function doEncode(btn) {
        const input = $input.value;
        if (!input.trim()) { toast('Please enter some code first.', 'warn'); return; }
        let wrapper = '';
        if (currentMode === 'basic') {
            const encoded = encodeURIComponent(input);
            wrapper = '<' + 'script>document.write(decodeURIComponent("' + encoded + '"))<' + '/script>';
        } else if (currentMode === 'full') {
            wrapper = '<' + 'script>document.write("' + unicodeEscape(input) + '")<' + '/script>';
        } else {
            wrapper = '<' + 'script>document.write(atob("' + utf8ToBase64(input) + '"))<' + '/script>';
        }
        $output.value = wrapper;
        updateStats();
        flashButton(btn, 'Encoded!');
        toast('Encoded successfully (' + currentMode + ' mode).', 'success');
    }

    /* ---------- Decode ---------- */
    function doDecode(btn) {
        const raw = $input.value;
        if (!raw.trim()) { toast('Please paste encoded code first.', 'warn'); return; }
        const decoded = smartDecode(raw);
        if (decoded === raw.trim()) {
            toast('No encoding pattern detected.', 'warn');
        } else {
            toast('Decoded successfully.', 'success');
        }
        $output.value = decoded;
        updateStats();
        flashButton(btn, 'Decoded!');
    }

    function smartDecode(raw) {
        let content = raw.trim(), m;
        m = content.match(/atob\(\s*["'](.+?)["']\s*\)/s);
        if (m) { try { return base64ToUtf8(m[1]); } catch (e) {} }
        m = content.match(/decodeURIComponent\(\s*["'](.+?)["']\s*\)/s);
        if (m) { try { return decodeURIComponent(m[1]); } catch (e) {} }
        m = content.match(/unescape\(\s*["'](.+?)["']\s*\)/s);
        if (m) content = m[1];
        else {
            m = content.match(/document\.write\(\s*["'](.+?)["']\s*\)/s);
            if (m) content = m[1];
        }
        if (/\\u[0-9a-fA-F]{4}/.test(content)) {
            return content.replace(/\\u([0-9a-fA-F]{4})/g, (_, h) =>
                String.fromCharCode(parseInt(h, 16)));
        }
        if (/%u[0-9a-fA-F]{4}/.test(content)) { try { return unescape(content); } catch (e) {} }
        try { return decodeURIComponent(content); } catch (e) {}
        try { return unescape(content); } catch (e) {}
        return content;
    }

    /* ---------- Swap / Clear ---------- */
    function swapSides() {
        if (!$output.value.trim()) { toast('Output is empty.', 'warn'); return; }
        const tmp = $input.value;
        $input.value = $output.value;
        $output.value = tmp;
        updateStats();
        toast('Swapped.', 'info');
    }
    function clearAll() {
        if (!$input.value && !$output.value) return;
        $input.value = ''; $output.value = '';
        updateStats();
        toast('Cleared.', 'info');
    }

    /* ---------- Copy ---------- */
    function copyOutput(btn) {
        if (!$output.value.trim()) { toast('Nothing to copy.', 'warn'); return; }
        $output.select(); $output.setSelectionRange(0, 999999);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText($output.value).then(() => {
                toast('Copied to clipboard!', 'success');
            }).catch(() => {
                toast(ok ? 'Copied!' : 'Copy failed — press Ctrl+C.', ok ? 'success' : 'error');
            });
        } else {
            toast(ok ? 'Copied!' : 'Copy failed — press Ctrl+C.', ok ? 'success' : 'error');
        }
        flashButton(btn, 'Copied!');
    }

    /* ---------- Download ---------- */
    function downloadOutput() {
        if (!$output.value.trim()) { toast('Output is empty.', 'warn'); return; }
        const blob = new Blob([$output.value], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sajeel-mods-encoded-' + Date.now() + '.html';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('File downloaded!', 'success');
    }

    /* ---------- Upload ---------- */
    function uploadFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => {
            $input.value = evt.target.result;
            updateStats();
            toast('File loaded: ' + file.name, 'success');
        };
        reader.onerror = () => toast('Failed to read file.', 'error');
        reader.readAsText(file);
        e.target.value = '';
    }

    /* ---------- Preview (Blob URL — bulletproof) ---------- */
    function preview(which) {
        const code = which === 0 ? $input.value : $output.value;
        if (!code.trim()) { toast('Nothing to preview.', 'warn'); return; }
        const trimmed = code.trim();
        const isFullDoc = /^<!DOCTYPE\s+html|^<html[\s>]/i.test(trimmed);
        const fullHtml = isFullDoc
            ? code
            : '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
              '<style>body{font-family:Arial,sans-serif;padding:16px;margin:0;color:#111;background:#fff;}</style>' +
              '</head><body>' + code + '</body></html>';
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        $previewIframe.src = url;
        $previewTitle.innerHTML = '<i class="fas fa-eye"></i> ' +
            (which === 0 ? 'Input Preview' : 'Output Preview');
        $previewModal.classList.add('show');
        setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    function closePreview() {
        $previewModal.classList.remove('show');
        $previewIframe.src = 'about:blank';
    }
    $previewModal.addEventListener('click', e => {
        if (e.target === $previewModal) closePreview();
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && $previewModal.classList.contains('show')) closePreview();
    });

    /* ---------- Utils ---------- */
    function flashButton(btn, text) {
        if (!btn) return;
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i> ' + text;
        setTimeout(() => { btn.innerHTML = original; }, 1200);
    }
    function updateStats() {
        document.getElementById('topSize').innerHTML =
            '<i class="fas fa-text-height"></i> ' + $input.value.length + ' characters';
        document.getElementById('bottomSize').innerHTML =
            '<i class="fas fa-text-height"></i> ' + $output.value.length + ' characters';
    }
    $input.addEventListener('input', updateStats);
    updateStats();
</script>
</body>
</html>
